<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Video Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#4a0e85] bg-gradient-to-b from-[#6912c4] via-[#4a0e85] to-[#121629] text-white min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="py-4 px-6 flex justify-between items-center max-w-xl mx-auto w-full">
        <div class="flex items-center space-x-2">
            <div class="bg-white p-2 rounded-xl text-purple-700 shadow-md">
                <i class="fa-solid fa-download text-lg"></i>
            </div>
            <span class="text-xl font-black tracking-wider">ALL-IN-ONE</span>
        </div>
        <div class="flex items-center space-x-3">
            <button class="bg-gradient-to-r from-purple-500 to-indigo-600 text-white px-4 py-2 rounded-full text-xs font-bold shadow-md flex items-center space-x-1">
                <i class="fa-solid fa-mobile-screen"></i>
                <span>Install App</span>
            </button>
            <button class="text-white text-xl focus:outline-none">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Main Section -->
    <main class="flex-grow flex flex-col items-center px-4 pt-6 pb-12 max-w-xl mx-auto w-full">
        <h1 id="mainTitle" class="text-3xl sm:text-4xl font-black text-center mb-6 tracking-wide">TikTok Video Downloader</h1>

        <!-- Input Box -->
        <div class="w-full bg-white rounded-2xl p-2 shadow-2xl flex items-center relative mb-4">
            <input type="text" id="url" placeholder="Insert a link here" 
                class="w-full py-3 pl-4 pr-24 text-gray-800 placeholder-gray-400 bg-transparent focus:outline-none text-base">
            <button onclick="pasteLink()" type="button" 
                class="absolute right-3 bg-purple-100 hover:bg-purple-200 text-purple-700 px-3.5 py-2 rounded-xl text-sm font-bold transition flex items-center space-x-1 shadow-sm">
                <i class="fa-regular fa-paste"></i>
                <span>Paste</span>
            </button>
        </div>

        <!-- Download Button -->
        <button onclick="handleMainDownload()" id="downloadBtn"
            class="w-full bg-[#38bdf8] hover:bg-[#0ea5e9] text-gray-900 font-extrabold py-4 rounded-2xl transition duration-200 shadow-xl text-lg tracking-wide uppercase">
            Download
        </button>

        <!-- Loader -->
        <div id="loader" class="hidden mt-6 text-center space-y-2">
            <div class="inline-block w-7 h-7 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
            <p class="text-xs text-purple-200">Processing video...</p>
        </div>

        <!-- Result Section -->
        <div id="result" class="w-full mt-6 hidden space-y-4"></div>
    </main>

    <!-- Popup Modal (SSSTik Style Discover More / Cross Promotion) -->
    <div id="popupModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex flex-col justify-end hidden">
        <div class="bg-[#1a1f35] rounded-t-3xl p-6 border-t border-purple-500/30 max-w-xl mx-auto w-full space-y-4 shadow-2xl animate-slide-up">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h3 class="text-lg font-bold text-white">Discover more</h3>
                <button onclick="closePopup()" class="text-gray-400 hover:text-white text-xl px-2 py-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="space-y-2">
                <button onclick="switchPlatform('tiktok')" class="w-full flex items-center justify-between p-3.5 rounded-xl bg-gray-900/60 hover:bg-gray-800 text-white transition border border-gray-800">
                    <div class="flex items-center space-x-3">
                        <i class="fa-brands fa-tiktok text-pink-500 text-lg w-6"></i>
                        <span class="font-semibold text-sm">TikTok Video Downloader</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
                </button>

                <button onclick="switchPlatform('youtube')" class="w-full flex items-center justify-between p-3.5 rounded-xl bg-gray-900/60 hover:bg-gray-800 text-white transition border border-gray-800">
                    <div class="flex items-center space-x-3">
                        <i class="fa-brands fa-youtube text-red-500 text-lg w-6"></i>
                        <span class="font-semibold text-sm">YouTube Video Downloader</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
                </button>

                <button onclick="switchPlatform('facebook')" class="w-full flex items-center justify-between p-3.5 rounded-xl bg-gray-900/60 hover:bg-gray-800 text-white transition border border-gray-800">
                    <div class="flex items-center space-x-3">
                        <i class="fa-brands fa-facebook text-blue-500 text-lg w-6"></i>
                        <span class="font-semibold text-sm">Facebook Video Downloader</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
                </button>

                <button onclick="switchPlatform('instagram')" class="w-full flex items-center justify-between p-3.5 rounded-xl bg-gray-900/60 hover:bg-gray-800 text-white transition border border-gray-800">
                    <div class="flex items-center space-x-3">
                        <i class="fa-brands fa-instagram text-pink-400 text-lg w-6"></i>
                        <span class="font-semibold text-sm">Instagram Downloader</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
                </button>
            </div>

            <button onclick="closePopup()" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold py-3 rounded-xl transition text-center text-sm">
                Close
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-8 px-4 text-center text-purple-300/80 text-xs border-t border-purple-900/40 bg-[#0d101d] space-y-3">
        <div class="flex flex-wrap justify-center gap-4 text-sm font-medium text-purple-200">
            <a href="#" class="hover:underline">Contacts</a>
            <a href="#" class="hover:underline">TikTok Viewer</a>
            <a href="#" class="hover:underline">Twitter video downloader</a>
            <a href="#" class="hover:underline">Instagram Downloader</a>
        </div>
        <p class="text-gray-400 text-[11px]">We are not affiliated with social platforms.</p>
        <div class="pt-2 border-t border-gray-800 text-gray-300 font-semibold text-xs">
            Made by Hasan | WhatsApp: <a href="https://wa.me/8801636214939" target="_blank" class="text-green-400 underline">+8801636214939</a>
        </div>
        <p class="text-gray-500 text-[10px]">&copy; 2018-2026 SSSTik. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script>
        let currentPlatform = 'tiktok';

        function switchPlatform(platform) {
            currentPlatform = platform;
            const titleEl = document.getElementById('mainTitle');
            const urlInput = document.getElementById('url');
            const resultDiv = document.getElementById('result');
            
            resultDiv.classList.add('hidden');
            urlInput.value = '';

            if (platform === 'tiktok') {
                titleEl.innerText = 'TikTok Video Downloader';
                urlInput.placeholder = 'Insert TikTok link here';
            } else if (platform === 'youtube') {
                titleEl.innerText = 'YouTube Video Downloader';
                urlInput.placeholder = 'Insert YouTube link here';
            } else if (platform === 'facebook') {
                titleEl.innerText = 'Facebook Video Downloader';
                urlInput.placeholder = 'Insert Facebook link here';
            } else if (platform === 'instagram') {
                titleEl.innerText = 'Instagram Downloader';
                urlInput.placeholder = 'Insert Instagram link here';
            }
            closePopup();
        }

        function closePopup() {
            document.getElementById('popupModal').classList.add('hidden');
        }

        async function pasteLink() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    document.getElementById('url').value = text;
                } else {
                    alert('Clipboard is empty!');
                }
            } catch (err) {
                alert('Please paste manually.');
            }
        }

        async function handleMainDownload() {
            const urlInput = document.getElementById('url').value.trim();
            const resultDiv = document.getElementById('result');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('downloadBtn');

            if (!urlInput) {
                alert('Please insert a valid link.');
                return;
            }

            btn.disabled = true;
            loader.classList.remove('hidden');
            resultDiv.classList.add('hidden');

            try {
                if (currentPlatform === 'tiktok') {
                    const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                    const data = await response.json();

                    if (data.code === 0) {
                        const videoNoWm = data.data.play;
                        const videoHd = data.data.hdplay || videoNoWm;
                        const musicUrl = data.data.music;
                        const coverUrl = data.data.cover;
                        const title = data.data.title || 'TikTok Video';
                        const author = data.data.author?.nickname || 'Creator';

                        resultDiv.innerHTML = `
                            <div class="bg-gray-900 border border-purple-500/30 rounded-2xl p-4 shadow-2xl flex flex-col space-y-4">
                                <div class="flex items-center space-x-3">
                                    <img src="${coverUrl}" alt="Cover" class="w-16 h-16 object-cover rounded-xl border border-purple-500/40">
                                    <div class="overflow-hidden">
                                        <h3 class="text-sm font-bold text-white truncate">${author}</h3>
                                        <p class="text-xs text-gray-400 line-clamp-2 mt-0.5">${title}</p>
                                    </div>
                                </div>

                                <div class="flex flex-col space-y-2.5">
                                    <button onclick="triggerDownload('${videoHd}', 'tiktok_hd_${Date.now()}.mp4')"
                                        class="w-full bg-[#38bdf8] hover:bg-[#0ea5e9] text-gray-900 font-bold py-3 px-4 rounded-xl transition text-sm flex items-center justify-center space-x-2 shadow-md">
                                        <span>Without watermark HD</span>
                                        <span class="bg-gray-900/20 px-2 py-0.5 rounded text-[10px]">AD</span>
                                    </button>

                                    <button onclick="triggerDownload('${videoNoWm}', 'tiktok_${Date.now()}.mp4')"
                                        class="w-full bg-[#38bdf8] hover:bg-[#0ea5e9] text-gray-900 font-bold py-3 px-4 rounded-xl transition text-sm shadow-md">
                                        Without watermark
                                    </button>

                                    <button onclick="triggerDownload('${musicUrl}', 'tiktok_audio_${Date.now()}.mp3')"
                                        class="w-full bg-[#38bdf8] hover:bg-[#0ea5e9] text-gray-900 font-bold py-3 px-4 rounded-xl transition text-sm shadow-md">
                                        Download MP3
                                    </button>
                                </div>
                            </div>
                        `;
                        resultDiv.classList.remove('hidden');
                        
                        // Show Discover More Popup after download processed
                        setTimeout(() => {
                            document.getElementById('popupModal').classList.remove('hidden');
                        }, 1000);
                    } else {
                        alert('Video not found. Please check the link.');
                    }
                } else {
                    // Generic fallback result for other platforms in single-page mode
                    resultDiv.innerHTML = `
                        <div class="bg-gray-900 border border-purple-500/30 rounded-2xl p-4 shadow-2xl text-center space-y-3">
                            <p class="text-sm text-gray-300">Ready to download ${currentPlatform.toUpperCase()} video!</p>
                            <button onclick="triggerDownload('${urlInput}', '${currentPlatform}_video_${Date.now()}.mp4')"
                                class="w-full bg-[#38bdf8] hover:bg-[#0ea5e9] text-gray-900 font-bold py-3 px-4 rounded-xl transition text-sm shadow-md">
                                Download File Now
                            </button>
                        </div>
                    `;
                    resultDiv.classList.remove('hidden');
                    
                    setTimeout(() => {
                        document.getElementById('popupModal').classList.remove('hidden');
                    }, 1000);
                }
            } catch (error) {
                console.error(error);
                alert('Something went wrong. Try again.');
            } finally {
                loader.classList.add('hidden');
                btn.disabled = false;
            }
        }

        async function triggerDownload(fileUrl, filename) {
            try {
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename;
                
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (err) {
                const a = document.createElement('a');
                a.href = fileUrl;
                a.download = filename;
                a.target = '_blank';
                a.click();
            }
        }
    </script>
</body>
</html>
